<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b86ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8fcaff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fcaff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3b86ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="400" cy="225" r="180" fill="url(#radar)"/>

  <!-- Radar circles -->
  <circle cx="400" cy="225" r="70" fill="none" stroke="rgba(143, 202, 255, 0.18)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="400" cy="225" r="130" fill="none" stroke="rgba(143, 202, 255, 0.22)" stroke-width="1.2"/>
  <circle cx="400" cy="225" r="190" fill="none" stroke="rgba(143, 202, 255, 0.15)" stroke-width="1.2" stroke-dasharray="8 6"/>

  <!-- Crosshairs -->
  <line x1="160" y1="225" x2="640" y2="225" stroke="rgba(143, 202, 255, 0.2)" stroke-width="1"/>
  <line x1="400" y1="35" x2="400" y2="415" stroke="rgba(143, 202, 255, 0.2)" stroke-width="1"/>

  <!-- Data road nodes / graph visualization -->
  <g stroke="#8fcaff" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="280" y1="180" x2="350" y2="140"/>
    <line x1="350" y1="140" x2="450" y2="160"/>
    <line x1="450" y1="160" x2="520" y2="120"/>
    <line x1="350" y1="140" x2="400" y2="225"/>
    <line x1="400" y1="225" x2="490" y2="260"/>
    <line x1="400" y1="225" x2="320" y2="290"/>
    <line x1="490" y1="260" x2="440" y2="330"/>
    <line x1="320" y1="290" x2="380" y2="350"/>
  </g>

  <!-- Glowing accident data points -->
  <g>
    <!-- Cluster 1 -->
    <circle cx="350" cy="140" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #8fcaff)"/>
    <circle cx="450" cy="160" r="6" fill="#8fcaff"/>
    <circle cx="400" cy="225" r="8" fill="#ffffff" stroke="#3b86ff" stroke-width="3"/>
    <circle cx="520" cy="120" r="4.5" fill="#ff6b6b"/>
    <circle cx="280" cy="180" r="4" fill="#8fcaff"/>
    <circle cx="490" cy="260" r="6.5" fill="#ffaa44"/>
    <circle cx="320" cy="290" r="5" fill="#8fcaff"/>
    <circle cx="440" cy="330" r="4" fill="#8fcaff"/>
    <circle cx="380" cy="350" r="4.5" fill="#ff6b6b"/>
  </g>

  <!-- Telemetry HUD Labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#8fcaff" letter-spacing="1.5">
    <text x="35" y="45" opacity="0.9">SYS.REG // GERMAN ROAD ACCIDENT DATASET</text>
    <text x="35" y="65" fill="#a7afbd" font-size="10">ETL PIPELINE: ACTIVE [PANDAS + POSTGRESQL + FASTAPI]</text>
    <text x="35" y="420" fill="#a7afbd" font-size="10">SPATIAL QUERY: REGIONAL INCIDENT DENSITY</text>
    <text x="640" y="45" text-anchor="end" fill="#ffffff" font-size="10">RECORD COUNT: 300K+</text>
    <text x="640" y="420" text-anchor="end" fill="#8fcaff" font-size="10">SCHEMA: NORMALIZED 3NF</text>
  </g>

  <!-- HUD Corner brackets -->
  <path d="M 25 35 L 25 25 L 35 25" fill="none" stroke="#8fcaff" stroke-width="2"/>
  <path d="M 775 35 L 775 25 L 765 25" fill="none" stroke="#8fcaff" stroke-width="2"/>
  <path d="M 25 415 L 25 425 L 35 425" fill="none" stroke="#8fcaff" stroke-width="2"/>
  <path d="M 775 415 L 775 425 L 765 425" fill="none" stroke="#8fcaff" stroke-width="2"/>
</svg>
